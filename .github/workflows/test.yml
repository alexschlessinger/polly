name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    # Forks retain hosted runners. Disable the corresponding repository
    # variable to route future runs back to GitHub when the Mac is unavailable.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && ((matrix.os == 'macos-latest' && vars.POLLY_LOCAL_MACOS == 'true' && fromJSON('["self-hosted","macOS","ARM64","polly-local-macos"]')) || (matrix.os == 'ubuntu-latest' && vars.POLLY_LOCAL_LINUX == 'true' && fromJSON('["self-hosted","Linux","ARM64","polly-local-linux"]'))) || matrix.os }}
    timeout-minutes: 30
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: ${{ runner.environment != 'self-hosted' }}

      - name: Install Linux sandbox backend
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          # Ubuntu's AppArmor policy can restrict unprivileged user namespaces.
          # Modern bubblewrap intentionally has no setuid mode, so enable the
          # kernel facility it uses and prove the fixed backend works here.
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          /usr/bin/bwrap --ro-bind / / --dev /dev --proc /proc \
            --unshare-pid --die-with-parent /usr/bin/true

      - name: Build, vet, and test including required sandbox tests
        run: .github/ci.sh test

  race:
    runs-on: ${{ vars.POLLY_LOCAL_LINUX == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","Linux","ARM64","polly-local-linux"]') || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: ${{ runner.environment != 'self-hosted' }}

      - name: Race-sensitive storage, conversation, and coordination tests
        run: .github/ci.sh race

  cgo-free-build:
    runs-on: ${{ vars.POLLY_LOCAL_LINUX == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","Linux","ARM64","polly-local-linux"]') || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: ${{ runner.environment != 'self-hosted' }}

      - name: Build all five targets without CGO
        run: .github/ci.sh cross
